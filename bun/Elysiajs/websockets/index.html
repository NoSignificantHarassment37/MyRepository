<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester - Usuarios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .endpoint {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-send {
            background: #667eea;
            color: white;
        }

        .btn-send:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background: #c0392b;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .stat-value.success {
            color: #27ae60;
        }

        .stat-value.error {
            color: #e74c3c;
        }

        .results {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            background: #fafafa;
        }

        .result-item {
            background: white;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .result-item.success {
            border-left-color: #27ae60;
        }

        .result-item.error {
            border-left-color: #e74c3c;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-time {
            color: #667eea;
        }

        .result-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .result-status.success {
            background: #d4edda;
            color: #155724;
        }

        .result-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result-body {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .result-data {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-family: monospace;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 API Tester - Usuarios</h1>
        <div class="endpoint">POST https://approaches-behalf-vessels-climbing.trycloudflare.com</div>

        <div class="controls">
            <button class="btn-send" onclick="sendRequest()">Enviar Petición</button>
            <button class="btn-clear" onclick="clearResults()">Limpiar</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="total">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Éxitos</div>
                <div class="stat-value success" id="success">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Errores</div>
                <div class="stat-value error" id="errors">0</div>
            </div>
        </div>

        <div class="results" id="results">
            <div class="no-results">No hay resultados aún. ¡Haz clic en "Enviar Petición"!</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://approaches-behalf-vessels-climbing.trycloudflare.com/usuarios';
        
        let stats = {
            total: 0,
            success: 0,
            errors: 0
        };

        // Generadores de datos aleatorios
        function generateRandomEmail() {
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2, 10);
            return `user_${timestamp}_${random}@test.com`;
        }

        function generateRandomName() {
            const firstNames = ['Juan', 'María', 'Pedro', 'Ana', 'Luis', 'Carmen', 'José', 'Laura', 'Carlos', 'Sofia'];
            const lastNames = ['García', 'Rodríguez', 'López', 'Martínez', 'González', 'Pérez', 'Sánchez', 'Ramírez'];
            
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            
            return `${firstName} ${lastName}`;
        }

        function generateRandomPassword() {
            const length = Math.floor(Math.random() * 8) + 8; // 8-15 caracteres
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        function updateStats() {
            document.getElementById('total').textContent = stats.total;
            document.getElementById('success').textContent = stats.success;
            document.getElementById('errors').textContent = stats.errors;
        }

        function addResult(data, responseData, time, isSuccess, error = null) {
            const resultsDiv = document.getElementById('results');
            
            // Remover mensaje de "no hay resultados"
            if (resultsDiv.querySelector('.no-results')) {
                resultsDiv.innerHTML = '';
            }

            const resultItem = document.createElement('div');
            resultItem.className = `result-item ${isSuccess ? 'success' : 'error'}`;
            
            const statusClass = isSuccess ? 'success' : 'error';
            const statusText = isSuccess ? `✅ ${responseData.status || 200}` : `❌ ${error || 'Error'}`;
            
            resultItem.innerHTML = `
                <div class="result-header">
                    <span class="result-time">⏱️ ${time}ms</span>
                    <span class="result-status ${statusClass}">${statusText}</span>
                </div>
                <div class="result-body">
                    <strong>Enviado:</strong>
                    <div class="result-data">${JSON.stringify(data, null, 2)}</div>
                    ${isSuccess ? `
                        <strong style="margin-top: 8px; display: block;">Respuesta:</strong>
                        <div class="result-data">${JSON.stringify(responseData.body, null, 2)}</div>
                    ` : ''}
                </div>
            `;
            
            // Insertar al principio
            resultsDiv.insertBefore(resultItem, resultsDiv.firstChild);
        }

        async function sendRequest() {
            const btn = document.querySelector('.btn-send');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            const requestData = {
                email: generateRandomEmail(),
                name: generateRandomName(),
                password: generateRandomPassword()
            };

            const startTime = performance.now();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);

                const responseData = await response.json();

                stats.total++;
                if (response.ok) {
                    stats.success++;
                    addResult(requestData, { status: response.status, body: responseData }, duration, true);
                } else {
                    stats.errors++;
                    addResult(requestData, { status: response.status, body: responseData }, duration, false, `HTTP ${response.status}`);
                }

            } catch (error) {
                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);
                
                stats.total++;
                stats.errors++;
                addResult(requestData, {}, duration, false, error.message);
            } finally {
                updateStats();
                btn.disabled = false;
                btn.textContent = 'Enviar Petición';
            }
        }

        function clearResults() {
            stats = { total: 0, success: 0, errors: 0 };
            updateStats();
            document.getElementById('results').innerHTML = '<div class="no-results">No hay resultados aún. ¡Haz clic en "Enviar Petición"!</div>';
        }

        // Permitir enviar con Enter
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendRequest();
            }
        });
    </script>
</body>
</html>
