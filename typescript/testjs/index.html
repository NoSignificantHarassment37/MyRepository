<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Subir imagen</title>
  </head>
  <body>
    <h1>Subir imagen y paquete_id</h1>
    <form id="uploadForm">
      <label>Paquete ID:</label>
      <input
        type="number"
        name="paquete_id"
        id="paquete_id"
        required
      /><br /><br />
      <label>Imagen:</label>
      <input
        type="file"
        name="image"
        id="image"
        accept="image/*"
        required
      /><br /><br />
      <button type="submit">Subir</button>
    </form>

    <script src="upload.js"></script>
  </body>
</html>
